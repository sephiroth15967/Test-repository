<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAU Cuba · Catálogo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0e14; color: #e3e9f0; font-family: system-ui, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2rem; border-left: 5px solid #f59e0b; padding-left: 16px; }
        .subtitulo { color: #9ca8b8; margin-bottom: 24px; }
        .aviso { background: #1a2330; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .pau-card { background: #111720; border-radius: 24px; padding: 24px; margin-bottom: 24px; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; border-radius: 60px; font-weight: bold; border: none; cursor: pointer; }
        .btn-sec { background: #374151; }
        .hidden { display: none; }
        #debug-panel { background: #2d1f1a; border: 1px solid #f87171; padding: 12px; margin: 16px 0; border-radius: 12px; font-family: monospace; font-size: 0.9rem; }
        .error { color: #f87171; }
        .success { color: #10b981; }
        .warning { color: #fbbf24; }
        .footer { margin-top: 40px; text-align: center; color: #6a7a8e; }
    </style>
</head>
<body>
    <h1>🧰 PAU Cuba</h1>
    <div class="subtitulo">Productos de Alta Utilidad · Catálogo público</div>

    <!-- Panel de diagnóstico -->
    <div id="debug-panel">
        <strong>🛠️ Panel de diagnóstico:</strong>
        <div id="debug-messages"></div>
    </div>

    <!-- Panel de autenticación -->
    <div id="auth-panel" class="aviso">
        <div id="logged-out-view">
            <p>🔐 Inicia sesión para comprar/descargar:</p>
            <button id="show-login-modal-btn" class="btn" disabled>⏳ Verificando conexión...</button>
        </div>
        <div id="logged-in-view" class="hidden">
            <p>✅ Sesión: <span id="user-email-display"></span></p>
            <button id="logout-btn" class="btn btn-sec">Cerrar sesión</button>
        </div>
    </div>

    <!-- Catálogo -->
    <div id="products-container">Cargando catálogo...</div>

    <!-- Modal de login simplificado -->
    <div id="login-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
        <div style="background:#1a2330; padding:24px; border-radius:24px; max-width:400px;">
            <h3>Iniciar sesión</h3>
            <div id="magic-link-request-view">
                <input type="email" id="email-input" placeholder="tu@correo.com" style="width:100%; padding:10px; margin:10px 0; background:#0b0e14; color:white; border:1px solid #2c3a4e;">
                <button id="send-magic-link-btn" class="btn">Enviar código</button>
                <button id="close-modal-btn" class="btn btn-sec">Cancelar</button>
            </div>
            <div id="magic-link-verify-view" class="hidden">
                <input type="text" id="code-input" placeholder="Código de 6 dígitos" style="width:100%; padding:10px; margin:10px 0; background:#0b0e14; color:white;">
                <button id="verify-code-btn" class="btn">Verificar</button>
            </div>
        </div>
    </div>

    <div class="footer">⚡ PAU Cuba · Productos de Alta Utilidad</div>

    <script type="module">
        // ==================== CONFIGURACIÓN ====================
        const APP_ID = '3e267f71-c202-4744-b644-66354923e339';                     // ← Reemplazar
        const ADMIN_EMAIL = 'yoandrypardo@gmail.com';      // ← Reemplazar

        // Productos de respaldo (catálogo estático)
        const STATIC_PRODUCTS = [
            { id: '1', name: 'Santuario de la Clave Mágica', desc: 'PDF con matriz y nemotecnia.', price: 5.00, file: 'PAU_ClaveMagica_Cuba.pdf' },
            { id: '2', name: 'Diagnóstico de Luces Nauta', desc: 'HTML offline para router.', price: 3.50, file: 'PAU_NautaHogar_Cuba.html' },
            { id: '3', name: 'Detector de Paquete Chileno', desc: 'PDF anti-phishing.', price: 2.99, file: 'PAU_DetectorPhishing_Cuba.pdf' }
        ];

        const debugEl = document.getElementById('debug-messages');
        const productsEl = document.getElementById('products-container');
        const loginBtn = document.getElementById('show-login-modal-btn');
        const loginModal = document.getElementById('login-modal');
        
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'error' : (type === 'success' ? 'success' : 'warning');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugEl.appendChild(div);
            console.log(msg);
        }

        // Mostrar catálogo estático (modo offline)
        function renderStaticCatalog() {
            let html = '';
            STATIC_PRODUCTS.forEach(p => {
                html += `<div class="pau-card">
                    <h3>📦 ${p.name}</h3>
                    <p>${p.desc}</p>
                    <p><strong>💸 $${p.price} USD</strong></p>
                    <button class="btn" disabled style="opacity:0.5;">🔒 Inicia sesión para comprar</button>
                </div>`;
            });
            productsEl.innerHTML = html;
            loginBtn.textContent = 'Iniciar sesión (no disponible)';
            loginBtn.disabled = true;
            log('Catálogo estático cargado. La funcionalidad de compra está deshabilitada.', 'warning');
        }

        // Intentar cargar InstantDB y toda la lógica avanzada
        async function bootstrap() {
            try {
                // IMPORTANTE: Importar desde URL absoluta (CDN)
                log('Importando SDK de InstantDB desde CDN...');
                const module = await import('https://cdn.jsdelivr.net/npm/@instantdb/core@latest/dist/standalone.js');
                const { init, id } = module;
                
                log('SDK cargado. Inicializando app...');
                const db = init({ appId: APP_ID });
                
                // Prueba de conexión
                const { data, error } = await db.query({ products: {} });
                if (error) {
                    throw new Error(`Error de DB: ${error.message}`);
                }
                log(`Conexión exitosa. Productos en DB: ${data?.products?.length || 0}`, 'success');
                
                // Si no hay productos, los insertamos
                if (!data.products || data.products.length === 0) {
                    log('Insertando productos iniciales...');
                    const tx = db.tx;
                    await db.transact([
                        tx.products[id()].update(STATIC_PRODUCTS[0]),
                        tx.products[id()].update(STATIC_PRODUCTS[1]),
                        tx.products[id()].update(STATIC_PRODUCTS[2])
                    ]);
                    log('Productos insertados.', 'success');
                }
                
                // Aquí iría la lógica completa de auth, renderizado dinámico, pagos...
                // Por ahora mostramos que funciona y dejamos el botón activo.
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar sesión con Email';
                log('¡Sistema listo! La autenticación debería funcionar.', 'success');
                
                // (Opcional) Podemos recargar la página para que tome el estado completo
                // Pero por ahora dejamos así.
                
            } catch (e) {
                log(`ERROR: ${e.message}`, 'error');
                log('Posible causa: bloqueo de almacenamiento (Tracking Prevention) o falta de configuración CORS.', 'error');
                log('Usando modo catálogo estático.', 'warning');
                renderStaticCatalog();
            }
        }

        // Mientras carga, mostramos un placeholder
        productsEl.innerHTML = '<p>Verificando conexión con el servidor...</p>';
        
        // Arrancar
        bootstrap();

        // Eventos mínimos para que los botones funcionen
        loginBtn.addEventListener('click', () => {
            if (loginBtn.disabled) {
                alert('La autenticación no está disponible. Revisa el panel de diagnóstico.');
                return;
            }
            loginModal.classList.remove('hidden');
        });
        
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            loginModal.classList.add('hidden');
        });

        // Para los botones de enviar/verificar código, por ahora solo mostramos un mensaje
        document.getElementById('send-magic-link-btn').addEventListener('click', () => {
            alert('Funcionalidad en desarrollo. Pronto podrás iniciar sesión.');
        });
        document.getElementById('verify-code-btn').addEventListener('click', () => {
            alert('Funcionalidad en desarrollo.');
        });
    </script>
</body>
</html>
